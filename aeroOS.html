<html>
<head>
    <title>index</title>
    <style>
        .aero-body h2 {
    margin: 0 0 4px 0;
}

.aero-body p {
    margin: 0 0 5px 0;
}

.aero-field {
    display: flex;
    align-items: center;
    margin: 2px 0;
}

.aero-field label {
    width: 110px;
}

.aero-field input,
.aero-field select {
    margin: 0;
    padding: 3px 5px;
    box-sizing: border-box;
}

.aero-continue {
    margin-top: 8px;
}
        /*Aero Glass Window credit to makeaero.com  */
.aero-window {
  --hue: 210;
  --radius: 16px;
  --glass-opacity: 0.3;
  /* Alpha is baked into the tint so the colour stays vivid while the gloss
     highlights (layered on top) render at full strength. */
  --glass: hsl(var(--hue) 65% 52% / var(--glass-opacity));
  --frame: 6px;
  font-weight: 600;
  position: relative;
  isolation: isolate;
  width: 450px;
  min-height: 0;
  border-radius: var(--radius);
  overflow: hidden;
  box-sizing: border-box;
  font-family: "Segoe UI", Tahoma, Geneva, Verdana, system-ui, sans-serif;
  font-size: 12px;
  color: #1b1b1b;
  box-shadow:
    0 18px 44px rgba(0, 0, 0, 0.5),
    0 0 26px hsl(var(--hue) 90% 58% / 0.28),
    0 0 0 1px rgba(0, 0, 0, 0.55),
    inset 0 0 0 1px rgba(255, 255, 255, 0.95),
    inset 0 0 30px rgba(255, 255, 255, 0.28);
}

/* Colored glass sheet — vivid tint + specular gloss + diagonal sheen */
.aero-window::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  border-radius: var(--radius);
  background:
    /* diagonal reflection streak */
    linear-gradient(104deg, transparent 26%, rgba(255, 255, 255, 0.32) 42%, rgba(255, 255, 255, 0.05) 50%, transparent 64%),
    /* bright top specular highlight */
    linear-gradient(to bottom, rgba(255, 255, 255, 0.68), rgba(255, 255, 255, 0.2) 42%, rgba(255, 255, 255, 0) 54%),
    /* soft vertical shade for depth */
    linear-gradient(to bottom, rgba(255, 255, 255, 0.12), rgba(0, 0, 0, 0.12)),
    /* colored glass tint */
    var(--glass);
}

/* Frost whatever sits behind the window — the effect that makes it glass */
.aero-window::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -2;
  border-radius: var(--radius);
  -webkit-backdrop-filter: blur(18px) saturate(1.9);
  backdrop-filter: blur(18px) saturate(1.9);
}

/* ---- Title bar ---- */
.aero-window .aero-titlebar {
  display: flex;
  align-items: flex-start;
  gap: 3px;
  padding: 0 6px;
  margin: 2px 0;
  min-height: 26px;
  border-radius: var(--radius) var(--radius) 0 0;
  /* faint self-contained brushed sheen */
  background: repeating-linear-gradient(
    108deg,
    rgba(255, 255, 255, 0.05) 0 1px,
    transparent 1px 5px
  );
}

.aero-window .aero-titlebar-icon {
  width: 20px;
  height: 20px;
  margin-top: 7px;
  flex: none;
}

.aero-window .aero-titlebar-text {
  flex: 1;
  min-width: 0;
  margin-top: 7px;
  line-height: 16px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: #0b0b0b;
  /* white halo keeps the caption legible over any glass color */
  text-shadow: 0 0 4px #fff, 0 0 4px #fff, 0 0 7px #fff, 0 0 10px #fff;
}

/* ---- Caption buttons (capsule hanging from the top edge) ---- */
.aero-window .aero-caption {
  display: flex;
  flex: none;
  border: 1px solid rgba(0, 0, 0, 0.35);
  border-top: 0;
  border-radius: 0 0 4px 4px;
  overflow: hidden;
  box-shadow:
    0 1px 0 rgba(255, 255, 255, 0.9),
    1px 0 0 rgba(255, 255, 255, 0.7),
    -1px 0 0 rgba(255, 255, 255, 0.7);
}

.aero-window .aero-caption button {
  appearance: none;
  -webkit-appearance: none;
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 29px;
  height: 20px;
  margin: 0;
  padding: 0;
  border: 0;
  border-right: 1px solid rgba(0, 0, 0, 0.28);
  color: rgba(0, 0, 0, 0.68);
  cursor: pointer;
  background: linear-gradient(
    rgba(255, 255, 255, 0.55),
    rgba(255, 255, 255, 0.28) 46%,
    rgba(0, 0, 0, 0.08) 50%,
    rgba(0, 0, 0, 0.08) 78%,
    rgba(255, 255, 255, 0.4)
  );
  transition: box-shadow 0.12s ease, background 0.12s ease, color 0.12s ease;
}

.aero-window .aero-caption button:last-child {
  border-right: 0;
  min-width: 46px;
}

/* Glyphs drawn in pure CSS — no icon font, no images */
.aero-window .aero-caption .min::before {
  content: "";
  width: 10px;
  height: 2px;
  margin-top: 6px;
  background: currentColor;
  box-shadow: 0 1px 0 rgba(255, 255, 255, 0.4);
}
.aero-window .aero-caption .max::before {
  content: "";
  width: 11px;
  height: 9px;
  border: 1px solid currentColor;
  border-top-width: 2px;
}
.aero-window .aero-caption .close::before {
  content: "\2715";
  font-size: 11px;
  line-height: 1;
}

/* Hover / active — cyan Aero glow for min & max */
.aero-window .aero-caption button:not(.close):hover {
  color: #fff;
  background:
    radial-gradient(120% 90% at 50% 130%, #3fd0e6, transparent 60%),
    linear-gradient(#c3e3f4 48%, #1f79b0 50%);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.9), 0 0 8px 2px rgba(93, 196, 240, 0.85);
}
.aero-window .aero-caption button:not(.close):active {
  background:
    radial-gradient(120% 90% at 50% 130%, #12e6e6, transparent 60%),
    linear-gradient(#8fb3c9 48%, #0d3350 50%);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.8);
}

/* Close button — red */
.aero-window .aero-caption .close {
  color: #fff;
  background:
    radial-gradient(circle at -30% 50%, rgba(0, 0, 0, 0.4) 6%, transparent 55%),
    radial-gradient(circle at 130% 50%, rgba(0, 0, 0, 0.4) 6%, transparent 55%),
    linear-gradient(#e6a99f, #d16b5b 48%, #cf4b34 50%, #d8654c);
}
.aero-window .aero-caption .close:hover {
  background:
    radial-gradient(120% 90% at 50% 130%, #ff9a86, transparent 60%),
    linear-gradient(#ffc0b5 48%, #d40a0a 50%);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.9), 0 0 8px 2px rgba(255, 80, 48, 0.85);
}
.aero-window .aero-caption .close:active {
  background:
    radial-gradient(120% 90% at 50% 130%, #ff3a1a, transparent 60%),
    linear-gradient(#c94a3a 48%, #8b0000 50%);
}

/* ---- Menu bar ---- */
.aero-window .aero-menubar {
  display: flex;
  align-items: stretch;
  margin: 0 var(--frame);
  background: linear-gradient(#ffffff 0%, #eef2f9 45%, #dbe3f1 55%, #e9eef8 100%);
  border: 1px solid rgba(0, 0, 0, 0.35);
  border-bottom: 0;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
}
.aero-window .aero-menubar span {
  padding: 4px 10px;
  cursor: default;
  color: #1b1b1b;
}
.aero-window .aero-menubar span:hover {
  background: linear-gradient(#eaf4fd, #cfe8fb);
  box-shadow: inset 0 0 0 1px #b5dcfb;
  border-radius: 3px;
}

/* ---- Content area ---- */
.aero-window .aero-body {
  margin: 0 var(--frame);
  padding: 10px;
  min-height: 0;
  box-sizing: border-box;
  background: #f0f0f0;
  color: #1b1b1b;
  border: 2px solid rgba(0, 0, 0, 0.5);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.7);
  white-space: pre-wrap;
  overflow: auto;
}
.aero-window .aero-body {
  margin-bottom: var(--frame);
  border-radius: 0 0 3px 3px;
}

/* ---- Status bar ---- */
.aero-window .aero-statusbar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 var(--frame) var(--frame);
  padding: 3px 8px;
  min-height: 24px;
  font-size: 11px;
  color: #1b1b1b;
  background: linear-gradient(#f7f9fc, #e4e9f2);
  border: 1px solid rgba(0, 0, 0, 0.4);
  border-top: 0;
  border-radius: 0 0 3px 3px;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.85);
}
.aero-window .aero-statusbar .aero-status-grow {
  flex: 1;
}
/* Resize gripper (bottom-right dots) */
.aero-window .aero-statusbar .aero-gripper {
  width: 12px;
  height: 12px;
  background:
    radial-gradient(circle 1px at 2px 10px, rgba(0, 0, 0, 0.35) 99%, transparent),
    radial-gradient(circle 1px at 6px 10px, rgba(0, 0, 0, 0.35) 99%, transparent),
    radial-gradient(circle 1px at 10px 10px, rgba(0, 0, 0, 0.35) 99%, transparent),
    radial-gradient(circle 1px at 6px 6px, rgba(0, 0, 0, 0.35) 99%, transparent),
    radial-gradient(circle 1px at 10px 6px, rgba(0, 0, 0, 0.35) 99%, transparent),
    radial-gradient(circle 1px at 10px 2px, rgba(0, 0, 0, 0.35) 99%, transparent);
}

/* ---- Inactive (unfocused) window ---- */
.aero-window.inactive::before {
  background:
    linear-gradient(rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0.08) 44%, rgba(255, 255, 255, 0) 46%),
    hsl(var(--hue) 14% 84%);
  opacity: 0.82;
}
.aero-window.inactive .aero-titlebar-text {
  color: #5a5a5a;
  text-shadow: 0 0 4px #fff, 0 0 6px #fff;
}
/*dialog css ends here*/
        body
        {
            margin:0;
            overflow: hidden;
            background-color: black;
        }
        canvas{
            display:block;
        }
      </style>
    </head>
    <body>
        <canvas id="canvas"></canvas>
        <div class="aero-window" id="setupWindow">
        <div class="aero-titlebar">
        <img class="aero-titlebar-icon" src="dialogboxicon.png">
        <div class="aero-titlebar-text">aerOS Setup</div>
        <div class="aero-caption">
            <button class="min"></button>
            <button class="max"></button>
            <button class="close"></button>
        </div>
    </div>
<div class="aero-body">

    <h2>Welcome to aerOS</h2>
    <p>Let's personalize your experience!</p>

    <div class="aero-field">
        <label>User name</label>
        <input id="username" type="text" placeholder="Enter your name">
    </div>

    <div class="aero-field">
        <label>Date of birth</label>
        <input id="dob" type="date">
    </div>
        <div class="aero-field">
        <label>Appearance</label>
    <div class="button-group">
        <button type="button" class="appearance-btn active" data-mode="light"> Light </button>
        <button type="button" class="appearance-btn" data-mode="dark">Dark</button>
    </div>
</div>
    <div class="aero-field">
        <label>Clock format</label>
        <select id="clockFormat">
            <option value="12">12-hour</option>
            <option value="24">24-hour</option>
        </select>
    </div>

    <button class="aero-continue" id="continueBtn">Continue</button>

</div>

<div class="aero-statusbar">
    <span>aerOS Setup</span>
    <span>Ready</span>
    <span class="aero-status-grow"></span>
    <span>Ready</span>
    <span class="aero-gripper"></span>
</div>
            <style>
                #setupWindow{
                    display:none;
                    position: fixed;
                    top: 50%;
                    left: 50%;
                    transform: translate(-50%, -50%);
                    z-index: 10;
                    opacity: 0;
                }
                #setupWindow.show{
                    display:block;
                    opacity: 1;
                }
                .aero-window{
                    border: 2px solid rgba(255, 255, 255, 0.75);
                    overflow:hidden;
                    box-sizing: border-box;
                }
                .aero-body .aero-body{
                    box-sizing: border-box;
                }
                .aero-window .aero-statusbar{
                    box-sizing: border-box;
                }
                </style>
        <script>
        const continueBtn = document.getElementById("continueBtn");
        const setupWindow = document.getElementById("setupWindow");

        continueBtn.addEventListener("click", () => {
            const username = document.getElementById("username").value;
            const clockFormat = document.getElementById("clockFormat").value;
            console.log("username:", username);
            console.log("clock:", clockFormat);
            setupWindow.style.display = "none";
        });

        document.querySelectorAll(".appearance-btn").forEach(button => {
            button.addEventListener("click", () => {
                document.querySelectorAll(".appearance-btn")
                    .forEach(btn => btn.classList.remove("active"));
                button.classList.add("active");
                const appearance = button.dataset.mode;
               function changeWallpaper(path) {
                    wallpaperalpha = 0;

                    wallpaper.onload = () => {
                        wallpaperalpha = 0;
                    };

                    wallpaper.src = path;
                }
                if (appearance === "light") {
                    changeWallpaper("./1.jpg");
                } else {
                    changeWallpaper("./2.jpg");
                }
            console.log("Appearance:", appearance);
            });
        });
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const text = "Welcome to aerOS";
        let particles = [];
        let targetparticles = [];
        let formed = false;
        let flash = 0;
        let scattered = false;
        let showstart = false;
        let startalpha = 0;
        let startdirection = 1;
        let particlealpha = 1;
        let wallpaperalpha = 0;
        const wallpaper = new Image();
        wallpaper.src = "./1.jpg";
        const textcanvas=document.createElement("canvas");
        const textctx = textcanvas.getContext("2d");
        textcanvas.width = canvas.width;
        textcanvas.height = canvas.height;
        textctx.font = "bold 70px Arial";
        textctx.textAlign = "center";
        textctx.textBaseline = "middle";
        textctx.fillStyle = "white";
        textctx.fillText(text, canvas.width / 2, canvas.height / 2);
        const imageData = textctx.getImageData(0, 0, canvas.width, canvas.height);
        for (let y = 0; y < canvas.height; y += 4) {
            for (let x = 0; x < canvas.width; x += 4) {
                const index = (y * canvas.width + x) *4;
                if (imageData.data[index + 3] > 128) {
                    targetparticles.push({ x: x, y: y });
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: 0,
                    vy: 0,
                    targetX: x,
                    targetY: y,
                    size: Math.random() * 2 + 0.5,
                    speed: Math.random() * 0.08 + 0.05
                });
            }
    }
          }
    function animate() {
        ctx.fillStyle = "black";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        if (scattered && wallpaper.complete) {
            wallpaperalpha += 0.018;
            if (wallpaperalpha > 1) {
                wallpaperalpha = 1;
            }
            ctx.save();
            ctx.globalAlpha = wallpaperalpha;
            ctx.drawImage(
                wallpaper,
                0,
                0,
                canvas.width,
                canvas.height
            );
            ctx.restore();
        }
        let finished = true;
        particles.forEach(p => {
            if (!scattered) {
                p.x += (p.targetX -p.x) * p.speed;
                p.y += (p.targetY - p.y) * p.speed;
            } else {
                p.x += p.vx;
                p.y += p.vy;
                p.vx *= 0.98;
                p.vy *= 0.98;
            }
            if (Math.abs(p.targetX -p.x) > 1 || Math.abs(p.targetY - p.y) > 1) {
                finished = false;
            }
           if (p.size > 2){
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(180,245,255,${0.35*particlealpha})`;
            ctx.strokeStyle = `rgba(255,255, 255,${0.8*particlealpha})`;
            ctx.lineWidth = 1;
            ctx.shadowColor = "#5eeaff";
        ctx.shadowBlur = 10;
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;
    }
    else {
    ctx.beginPath();
    ctx.arc(
        p.x,
        p.y,
        p.size,
        0,
        Math.PI * 2
    );
    ctx.fillStyle = `rgba(1,90,109,${particlealpha})`;
    ctx.shadowColor = "#0040ff";
    ctx.shadowBlur = 8;
    ctx.fill();
    ctx.shadowBlur = 0;
    }
              });
              if (scattered && particlealpha > 0){
                particlealpha -= 0.01;
              }
                            if (finished && !formed) {
                                formed = true;
                                showstart = true;
                            }
                            if (flash > 0) {
                                ctx.fillStyle = `rgba(255,255,255,${flash})`;
                                ctx.fillRect(0, 0, canvas.width, canvas.height);
                                flash -= 0.05;
                            }
                            if (showstart && !scattered){
                                startalpha += 0.02 * startdirection;
                                if (startalpha >= 1){
                                    startalpha = 1;
                                    startdirection = -1;
                                }
                                if(startalpha <= 0.2){
                                    startalpha = 0.2;
                                    startdirection = 1;
                                }
                                ctx.font = "18px Arial";
                                ctx.textAlign = "center";
                                ctx.textBaseline = "middle";
                                ctx.fillStyle = `rgba(142,234,255, ${startalpha})`;
                                ctx.fillText("click anywhere to start",canvas.width/2,canvas.height/2+90);
                            }
                requestAnimationFrame(animate);
        }
    animate();
    canvas.addEventListener("click", () => {
        if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen();
        }
        if (!formed || scattered) return;
        scattered = true;
        flash = 1;
        particlealpha = 1;
        showstart = false;
        particles.forEach(p => {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 15 + 8;
            p.vx = Math.cos(angle) * speed;
            p.vy = Math.sin(angle) * speed;
        });
        setTimeout(() => {
            setupWindow.classList.add("show");
        }, 1200);
    });
    window.addEventListener("resize", () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    });
    </script>
    </body>
    </html>
